<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>YT Stream</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f0f;color:#fff;font-family:system-ui,sans-serif}
header{display:flex;align-items:center;padding:12px 24px;gap:12px;border-bottom:1px solid #333;flex-wrap:wrap}
header h1{font-size:20px;cursor:pointer}
.search-box{flex:1;min-width:200px;max-width:600px;display:flex}
.search-box input{flex:1;padding:10px 16px;border:1px solid #555;background:#222;color:#fff;border-radius:20px 0 0 20px;font-size:14px}
.search-box button{padding:10px 20px;background:#ff0000;border:none;border-radius:0 20px 20px 0;color:#fff;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding:20px}
.card{cursor:pointer;border-radius:12px;overflow:hidden}
.card:hover{transform:scale(1.02)}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#222}
.card .dur{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.8);padding:2px 6px;border-radius:4px;font-size:11px}
.card .info{padding:10px 12px}
.card .title{font-size:14px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{font-size:12px;color:#aaa;margin-top:4px}
.player-page{display:none;padding:20px;max-width:960px;margin:0 auto}
.player-page video{width:100%;aspect-ratio:16/9;border-radius:12px;background:#000}
.player-page h2{margin-top:12px;font-size:18px}
.player-page .ch{color:#aaa;font-size:14px;margin-top:4px}
.player-page .err{color:#f66;margin-top:12px}
.back-btn{display:inline-block;margin-bottom:12px;color:#4fc3f7;cursor:pointer}
.loading{text-align:center;padding:40px;color:#888}
</style>
</head>
<body>
<header>
  <h1 onclick="goHome()">▶ YT Stream</h1>
  <div class="search-box">
    <input id="q" placeholder="検索..." onkeydown="if(event.key==='Enter')doSearch()">
    <button onclick="doSearch()">検索</button>
  </div>
</header>

<div id="grid" class="grid"></div>
<div id="player-page" class="player-page">
  <span class="back-btn" onclick="goHome()">← 戻る</span>
  <video id="vid" controls playsinline></video>
  <h2 id="v-title"></h2>
  <p class="ch" id="v-ch"></p>
  <p class="err" id="err-msg"></p>
</div>

<script>
function goHome(){
  const v=document.getElementById('vid');
  v.pause();v.src='';v.load();
  document.getElementById('player-page').style.display='none';
  document.getElementById('grid').style.display='grid';
}

async function doSearch(){
  const q=document.getElementById('q').value.trim();
  if(!q)return;
  const g=document.getElementById('grid');
  g.innerHTML='<div class="loading">検索中...</div>';
  try{
    const d=await fetch('/api/search?q='+encodeURIComponent(q)).then(r=>r.json());
    g.innerHTML='';
    (d.items||[]).forEach(v=>{
      const div=document.createElement('div');
      div.className='card';
      div.style.position='relative';
      div.onclick=()=>play(v.id,v.title,v.channel);
      div.innerHTML=`<img src="${v.thumbnail}" loading="lazy" onerror="this.src='https://img.youtube.com/vi/${v.id}/hqdefault.jpg'">
        <span class="dur">${esc(v.duration)}</span>
        <div class="info"><div class="title">${esc(v.title)}</div>
        <div class="meta">${esc(v.channel)}</div></div>`;
      g.appendChild(div);
    });
    if(!d.items?.length) g.innerHTML='<div class="loading">結果なし</div>';
  }catch(e){
    g.innerHTML='<div class="loading">エラー: '+esc(e.message)+'</div>';
  }
}

async function play(id,title,channel){
  document.getElementById('grid').style.display='none';
  document.getElementById('player-page').style.display='block';
  document.getElementById('v-title').textContent=title||'';
  document.getElementById('v-ch').textContent=channel||'';
  document.getElementById('err-msg').textContent='';
  const vid=document.getElementById('vid');
  vid.pause();vid.src='';vid.load();

  try{
    // Cobalt APIにYouTube URLを送信 → ストリームURLを返す
    const d=await fetch('/api/cobalt',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        url:`https://www.youtube.com/watch?v=${id}`,
        downloadMode:'auto',
        videoQuality:'1080'
      })
    }).then(r=>r.json());

    if(d.url){
      // ストリームURLが返ってきた → 直接再生
      vid.src=d.url;
      vid.play();
    } else if(d.tunnel){
      // タンネルURL（Cobaltが中継）
      vid.src=d.tunnel;
      vid.play();
    } else if(d.redirect){
      vid.src=d.redirect;
      vid.play();
    } else {
      document.getElementById('err-msg').textContent='⚠️ ストリームURL取得失敗: '+(d.error||JSON.stringify(d));
    }
  }catch(e){
    document.getElementById('err-msg').textContent='エラー: '+e.message;
  }
}

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
</script>
</body>
</html>
