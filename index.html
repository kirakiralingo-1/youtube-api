<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>YT Stream</title>
<script src="https://cdn.jsdelivr.net/npm/dashjs@4.7.4/dist/dash.all.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f0f;color:#fff;font-family:system-ui,sans-serif}
header{display:flex;align-items:center;padding:12px 24px;gap:12px;border-bottom:1px solid #333;flex-wrap:wrap}
header h1{font-size:20px;cursor:pointer;white-space:nowrap}
.search-box{flex:1;min-width:200px;max-width:600px;display:flex}
.search-box input{flex:1;padding:10px 16px;border:1px solid #555;background:#222;color:#fff;border-radius:20px 0 0 20px;font-size:14px}
.search-box button{padding:10px 20px;background:#ff0000;border:none;border-radius:0 20px 20px 0;color:#fff;cursor:pointer;font-size:14px}
.tabs{display:flex;gap:8px}
.tabs button{padding:6px 16px;border:1px solid #555;background:transparent;color:#ccc;border-radius:16px;cursor:pointer;font-size:13px}
.tabs button.active{background:#fff;color:#000}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding:20px}
.card{cursor:pointer;border-radius:12px;overflow:hidden;transition:transform .15s}
.card:hover{transform:scale(1.02)}
.card .thumb{position:relative}
.card .thumb img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#222}
.card .dur{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.8);padding:2px 6px;border-radius:4px;font-size:11px}
.card .info{padding:10px 12px}
.card .title{font-size:14px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{font-size:12px;color:#aaa;margin-top:4px}
.player-page{display:none;padding:20px;max-width:960px;margin:0 auto}
.player-page video{width:100%;aspect-ratio:16/9;border-radius:12px;background:#000}
.player-page h2{margin-top:12px;font-size:18px}
.player-page .ch{color:#aaa;font-size:14px;margin-top:4px}
.player-page .q-sel{margin-top:12px;display:flex;align-items:center;gap:8px}
.player-page .q-sel label{font-size:13px;color:#aaa}
.player-page .q-sel select{padding:6px 12px;background:#222;color:#fff;border:1px solid #555;border-radius:6px}
.back-btn{display:inline-block;margin-bottom:12px;color:#4fc3f7;cursor:pointer;font-size:14px}
.loading{text-align:center;padding:40px;color:#888}
.err{color:#f66;padding:20px}
</style>
</head>
<body>
<header>
  <h1 onclick="goHome()">▶ YT</h1>
  <div class="search-box">
    <input id="q" placeholder="検索..." onkeydown="if(event.key==='Enter')doSearch()">
    <button onclick="doSearch()">検索</button>
  </div>
  <div class="tabs">
    <button id="tab-t" class="active" onclick="showTrend()">トレンド</button>
    <button id="tab-s" onclick="showSearchTab()">検索</button>
  </div>
</header>

<div id="grid" class="grid"></div>
<div id="player-page" class="player-page">
  <span class="back-btn" onclick="goHome()">← 戻る</span>
  <video id="vid" controls playsinline></video>
  <h2 id="v-title"></h2>
  <p class="ch" id="v-ch"></p>
  <div class="q-sel" id="q-wrap" style="display:none">
    <label>品質:</label>
    <select id="q-sel" onchange="switchQuality()"></select>
  </div>
</div>

<script>
let dashPlayer = null;
let currentQualities = [];

function goHome(){
  destroyPlayer();
  document.getElementById('player-page').style.display='none';
  document.getElementById('grid').style.display='grid';
  showTrend();
}

function showTrend(){ setTab('t'); loadGrid('/api/trending'); }
function showSearchTab(){ setTab('s'); const q=document.getElementById('q').value.trim(); if(q)doSearch(); }
function doSearch(){
  const q=document.getElementById('q').value.trim();
  if(!q)return;
  setTab('s');
  loadGrid('/api/search?q='+encodeURIComponent(q));
}
function setTab(t){
  document.getElementById('tab-t').classList.toggle('active',t==='t');
  document.getElementById('tab-s').classList.toggle('active',t==='s');
}

async function loadGrid(url){
  const g=document.getElementById('grid');
  g.innerHTML='<div class="loading">読み込み中...</div>';
  try{
    const d=await fetch(url).then(r=>r.json());
    g.innerHTML='';
    (d.items||[]).forEach(v=>{
      const div=document.createElement('div');
      div.className='card';
      div.onclick=()=>play(v.id);
      div.innerHTML=`<div class="thumb"><img src="${v.thumbnail}" loading="lazy" onerror="this.onerror=null;this.src='https://img.youtube.com/vi/${v.id}/hqdefault.jpg'"><span class="dur">${esc(v.duration)}</span></div>
        <div class="info"><div class="title">${esc(v.title)}</div>
        <div class="meta">${esc(v.channel)} · ${esc(v.views)}</div></div>`;
      g.appendChild(div);
    });
    if(!d.items?.length) g.innerHTML='<div class="loading">結果なし</div>';
  }catch(e){
    g.innerHTML='<div class="err">エラー: '+esc(e.message)+'</div>';
  }
}

function destroyPlayer(){
  if(dashPlayer){ dashPlayer.reset(); dashPlayer=null; }
  const vid=document.getElementById('vid');
  vid.src='';
  vid.load();
}

async function play(id){
  document.getElementById('grid').style.display='none';
  document.getElementById('player-page').style.display='block';
  document.getElementById('v-title').textContent='読み込み中...';
  document.getElementById('v-ch').textContent='';
  document.getElementById('q-wrap').style.display='none';
  document.getElementById('q-sel').innerHTML='';
  destroyPlayer();

  try{
    const d=await fetch('/api/stream/'+id).then(r=>r.json());
    if(d.error) throw new Error(d.error);

    document.getElementById('v-title').textContent=d.title;
    document.getElementById('v-ch').textContent=d.channel;
    const vid=document.getElementById('vid');

    if(d.directUrl){
      // progressive直接URL → <video> で再生
      vid.src=d.directUrl;
      vid.play();
      if(d.qualities?.length>1){
        currentQualities=d.qualities;
        document.getElementById('q-wrap').style.display='flex';
        const sel=document.getElementById('q-sel');
        d.qualities.forEach(q=>{
          const opt=document.createElement('option');
          opt.value=q.url;
          opt.textContent=q.quality;
          sel.appendChild(opt);
        });
      }
    } else if(d.dashVideo && d.dashAudio){
      // DASH manifestを生成してdash.jsで再生
      const manifest = generateDashManifest(d.dashVideo, d.dashAudio);
      const uri = "data:application/dash+xml;charset=utf-8;base64," + btoa(unescape(encodeURIComponent(manifest)));
      dashPlayer = dashjs.MediaPlayer().create();
      dashPlayer.initialize(vid, uri, true);
    } else {
      document.getElementById('v-title').textContent='再生可能なストリームが見つかりません';
    }
  }catch(e){
    document.getElementById('v-title').textContent='エラー: '+e.message;
  }
}

function generateDashManifest(video, audio){
  const ts = new Date().toISOString().replace(/[-:]/g,'').replace('T','_').split('.')[0];
  return `<?xml version="1.0"?>
<MPD type="static" mediaPresentationDuration="99999.000" minBufferTime="4.000" profiles="urn:mpeg:dash:profile:full:2011" xmlns="urn:mpeg:dash:schema:mpd:2011">
  <Period duration="99999.000">
    <AdaptationSet mimeType="${video.mimeType}" segmentAlignment="true">
      <Representation id="v${video.itag}" bandwidth="5000000" codecs="avc1.640028" height="${video.height}" width="1920">
        <BaseURL>${video.url}</BaseURL>
      </Representation>
    </AdaptationSet>
    <AdaptationSet mimeType="${audio.mimeType}" segmentAlignment="true">
      <Representation id="a${audio.itag}" bandwidth="128000" codecs="mp4a.40.2">
        <BaseURL>${audio.url}</BaseURL>
      </Representation>
    </AdaptationSet>
  </Period>
</MPD>`;
}

function switchQuality(){
  const url=document.getElementById('q-sel').value;
  if(url){
    destroyPlayer();
    const vid=document.getElementById('vid');
    vid.src=url;
    vid.play();
  }
}

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}

showTrend();
</script>
</body>
</html
