<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YT Clone</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <header>
    <a class="logo" href="#">▶ YT C</a>
    <div class="search-bar">
      <input id="q" type="text" placeholder="動画を検索..." autocomplete="off"/>
      <button id="searchBtn">検索</button>
    </div>
    <nav>
      <button class="tab active" data-tab="trending">🔥 人気</button>
      <button class="tab" data-tab="search">🔍 検索</button>
    </nav>
  </header>

  <main>
    <div id="grid" class="grid"></div>
  </main>

  <div id="overlay" class="overlay hidden">
    <button id="closeBtn" class="close-btn">&times;</button>
    <div id="playerWrap">
      <video id="videoEl" controls playsinline style="display:none"></video>
      <div id="dashWrap" style="display:none">
        <video id="dashVideo" muted playsinline></video>
        <audio id="dashAudio"></audio>
      </div>
      <div id="loading" class="loading">読み込み中…</div>
    </div>
    <h2 id="playerTitle"></h2>
  </div>

  <script src="app.js"></script>
</body>
</html>
