<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tube</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f0f0f;--sf:#212121;--sf2:#121212;--bd:#3f3f3d;--tx:#f1f1f1;--sub:#aaa;--ac:#ff0000;--hov:#3d3d3d;--chip:#272727}
body{font-family:Roboto,-apple-system,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--tx);overflow-x:hidden}
button{font-family:inherit;cursor:pointer}

#header{position:fixed;top:0;left:0;right:0;height:56px;background:var(--bg);display:flex;align-items:center;padding:0 16px;z-index:1000;gap:8px}
.h-left{display:flex;align-items:center;gap:8px;min-width:180px}
.h-center{flex:1;display:flex;justify-content:center;max-width:728px;margin:0 24px}
.h-right{display:flex;align-items:center;gap:4px;min-width:180px;justify-content:flex-end}
.icon-btn{width:40px;height:40px;border-radius:50%;border:none;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--tx);font-size:20px;transition:background .15s}
.icon-btn:hover{background:var(--hov)}
.logo{display:flex;align-items:center;gap:2px;font-size:20px;font-weight:700;letter-spacing:-1px;cursor:pointer}
.logo .play-icon{width:28px;height:20px;background:var(--ac);border-radius:4px;display:flex;align-items:center;justify-content:center}
.logo .play-icon::after{content:'';border-left:8px solid #fff;border-top:5px solid transparent;border-bottom:5px solid transparent}
.search-form{display:flex;flex:1;max-width:640px}
.search-form input{flex:1;height:40px;padding:0 16px;border-radius:20px 0 0 20px;border:1px solid var(--bd);background:var(--sf2);color:var(--tx);font-size:16px;outline:none}
.search-form input:focus{border-color:#1c62b9}
.search-form .s-btn{width:64px;height:40px;border-radius:0 20px 20px 0;border:1px solid var(--bd);border-left:none;background:var(--sf);display:flex;align-items:center;justify-content:center;color:var(--tx);font-size:18px}
.search-form .s-btn:hover{background:var(--hov)}
.avatar{width:32px;height:32px;border-radius:50%;background:#7c4dff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;color:#fff}

#sidebar{position:fixed;top:56px;left:0;bottom:0;width:240px;background:var(--bg);overflow-y:auto;padding:12px 0;z-index:900;transition:transform .2s}
#sidebar.collapsed{width:72px}
#sidebar.collapsed .s-item span:last-child{display:none}
#sidebar.collapsed .s-item{justify-content:center;padding:14px 0}
#sidebar.collapsed .s-divider,#sidebar.collapsed .s-label{display:none}
.s-item{display:flex;align-items:center;gap:24px;padding:10px 24px;border-radius:10px;margin:0 12px;cursor:pointer;font-size:14px;transition:background .1s}
.s-item:hover{background:var(--hov)}
.s-item.active{background:var(--hov)}
.s-item .s-icon{width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.s-divider{height:1px;background:var(--bd);margin:12px 0}
.s-label{padding:8px 24px;font-size:13px;font-weight:500;color:var(--sub)}

#main{margin-top:56px;margin-left:240px;transition:margin-left .2s}
#main.full{margin-left:72px}

#chips{display:flex;gap:12px;padding:12px 24px;overflow-x:auto;position:sticky;top:56px;background:var(--bg);z-index:100}
#chips::-webkit-scrollbar{display:none}
.chip{padding:8px 12px;border-radius:8px;background:var(--chip);color:var(--tx);font-size:14px;white-space:nowrap;cursor:pointer;border:none;transition:background .15s}
.chip:hover{background:var(--hov)}
.chip.active{background:var(--tx);color:var(--bg)}

#video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;padding:8px 24px 24px}
.vcard{cursor:pointer}
.vcard .thumb{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#333}
.vcard .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.vcard .dur{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.8);padding:2px 4px;border-radius:4px;font-size:12px;font-weight:500}
.vcard .v-meta{display:flex;gap:12px;margin-top:12px}
.vcard .v-avatar{width:36px;height:36px;border-radius:50%;background:var(--hov);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500}
.vcard .v-info{flex:1;min-width:0}
.vcard .v-title{font-size:16px;font-weight:500;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:4px}
.vcard .v-ch{font-size:13px;color:var(--sub);margin-bottom:2px}
.vcard .v-stats{font-size:13px;color:var(--sub)}

#watch-page{display:none;padding:24px;max-width:1754px;margin:0 auto}
#watch-page.active{display:block}
#watch-layout{display:flex;gap:24px}
#watch-primary{flex:1;min-width:0}
#watch-player{width:100%;aspect-ratio:16/9;border-radius:12px;background:#000;overflow:hidden}
#watch-player video{width:100%;height:100%;display:block}
#watch-title{font-size:20px;font-weight:700;margin:12px 0 8px}
#watch-actions{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px}
#watch-ch-info{display:flex;align-items:center;gap:12px}
#watch-ch-avatar{width:40px;height:40px;border-radius:50%;background:var(--hov);display:flex;align-items:center;justify-content:center;font-weight:500}
#watch-ch-name{font-size:16px;font-weight:500}
#watch-ch-subs{font-size:12px;color:var(--sub)}
#watch-sub-btn{padding:10px 16px;border-radius:20px;border:none;background:var(--tx);color:var(--bg);font-size:14px;font-weight:500;margin-left:12px}
#watch-sub-btn.subbed{background:var(--hov);color:var(--tx)}
#watch-btns{display:flex;gap:8px;align-items:center}
.wbtn{display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:20px;border:none;background:var(--chip);color:var(--tx);font-size:14px;font-weight:500}
.wbtn:hover{background:var(--hov)}
#watch-desc{background:var(--chip);border-radius:12px;padding:12px;font-size:14px;line-height:1.6;margin-top:8px;cursor:pointer}
#watch-desc .desc-stats{font-weight:500;margin-bottom:4px}
#watch-desc .desc-body{color:var(--sub)}

#watch-secondary{width:402px;flex-shrink:0}
.up-next{border-radius:12px;overflow:hidden;cursor:pointer;display:flex;gap:8px;margin-bottom:8px}
.up-next:hover .un-title{color:#fff}
.up-next .un-thumb{width:168px;aspect-ratio:16/9;flex-shrink:0;overflow:hidden;border-radius:8px;background:#333;position:relative}
.up-next .un-thumb img{width:100%;height:100%;object-fit:cover}
.up-next .un-thumb .dur{position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,.8);padding:1px 4px;border-radius:4px;font-size:11px;font-weight:500}
.up-next .un-info{padding:4px 0}
.up-next .un-title{font-size:14px;font-weight:500;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.up-next .un-ch{font-size:12px;color:var(--sub);margin-top:4px}
.up-next .un-stats{font-size:12px;color:var(--sub)}

.empty,.loading{grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--sub)}
.empty .e-icon{font-size:64px;display:block;margin-bottom:16px}
.empty p{font-size:16px;margin-bottom:8px}

@media(max-width:1100px){#watch-secondary{display:none}}
@media(max-width:900px){#sidebar{transform:translateX(-100%)}#main{margin-left:0!important}}
</style>
</head>
<body>

<header id="header">
  <div class="h-left">
    <button class="icon-btn" onclick="toggleSidebar()">☰</button>
    <div class="logo" onclick="goHome()"><span class="play-icon"></span>MyTube</div>
  </div>
  <div class="h-center">
    <form class="search-form" onsubmit="doSearch();return false">
      <input id="search-input" type="text" placeholder="検索">
      <button class="s-btn" type="submit">🔍</button>
    </form>
  </div>
  <div class="h-right">
    <div class="avatar">M</div>
  </div>
</header>

<nav id="sidebar">
  <div class="s-item active" onclick="goHome()"><span class="s-icon">🏠</span><span>ホーム</span></div>
  <div class="s-item" onclick="doSearchWith('shorts')"><span class="s-icon">⚡</span><span>Shorts</span></div>
  <div class="s-item" onclick="doSearchWith('登録チャンネル')"><span class="s-icon">📺</span><span>登録チャンネル</span></div>
  <div class="s-divider"></div>
  <div class="s-label">あなた</div>
  <div class="s-item" onclick="doSearchWith('履歴')"><span class="s-icon">🕐</span><span>履歴</span></div>
  <div class="s-item" onclick="doSearchWith('プレイリスト')"><span class="s-icon">📋</span><span>プレイリスト</span></div>
  <div class="s-item" onclick="doSearchWith('後で見る')"><span class="s-icon">⏰</span><span>後で見る</span></div>
  <div class="s-item" onclick="doSearchWith('評価した動画')"><span class="s-icon">👍</span><span>評価した動画</span></div>
  <div class="s-divider"></div>
  <div class="s-label">おすすめ</div>
  <div class="s-item" onclick="doSearchWith('トレンド')"><span class="s-icon">🔥</span><span>トレンド</span></div>
  <div class="s-item" onclick="doSearchWith('音楽')"><span class="s-icon">🎵</span><span>音楽</span></div>
  <div class="s-item" onclick="doSearchWith('ゲーム')"><span class="s-icon">🎮</span><span>ゲーム</span></div>
  <div class="s-item" onclick="doSearchWith('ニュース')"><span class="s-icon">📰</span><span>ニュース</span></div>
  <div class="s-item" onclick="doSearchWith('スポーツ')"><span class="s-icon">⚽</span><span>スポーツ</span></div>
</nav>

<div id="main">
  <div id="home-page">
    <div id="chips">
      <button class="chip active" onclick="setChip(this,'すべて')">すべて</button>
      <button class="chip" onclick="setChip(this,'音楽')">音楽</button>
      <button class="chip" onclick="setChip(this,'ゲーム')">ゲーム</button>
      <button class="chip" onclick="setChip(this,'ライブ')">ライブ</button>
      <button class="chip" onclick="setChip(this,'ニュース')">ニュース</button>
      <button class="chip" onclick="setChip(this,'スポーツ')">スポーツ</button>
    </div>
    <div id="video-grid"></div>
  </div>

  <div id="watch-page">
    <div id="watch-layout">
      <div id="watch-primary">
        <div id="watch-player"><video id="watch-video" controls></video></div>
        <h1 id="watch-title"></h1>
        <div id="watch-actions">
          <div id="watch-ch-info">
            <div id="watch-ch-avatar"></div>
            <div>
              <div id="watch-ch-name"></div>
              <div id="watch-ch-subs"></div>
            </div>
            <button id="watch-sub-btn" onclick="toggleSub()">登録する</button>
          </div>
          <div id="watch-btns">
            <button class="wbtn" onclick="likeVideo()">👍 <span id="like-count">0</span></button>
            <button class="wbtn">👎</button>
            <button class="wbtn" onclick="shareVideo()">↗️ 共有</button>
            <button class="wbtn" onclick="downloadVideo()">⬇️ ダウンロード</button>
          </div>
        </div>
        <div id="watch-desc" onclick="this.classList.toggle('expanded')">
          <div class="desc-stats" id="desc-stats"></div>
          <div class="desc-body" id="desc-body"></div>
        </div>
      </div>
      <div id="watch-secondary"><div id="up-next-list"></div></div>
    </div>
  </div>
</div>

<script>
let allVideos = [];
let currentVideo = null;
let likeCount = 0;

// ── サフェティヘルパー ──
function safe(str, fallback) {
  return (typeof str === 'string' && str.length > 0) ? str : (fallback || '');
}
function firstChar(str) {
  const s = safe(str, 'C');
  return s.charAt(0).toUpperCase();
}
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

// ── NAV ──
function goHome(){
  document.getElementById('watch-page').classList.remove('active');
  document.getElementById('home-page').style.display='';
  const p=document.getElementById('watch-video');
  p.pause(); p.src='';
  renderGrid();
}

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('collapsed');
  document.getElementById('main').classList.toggle('full');
}

function setChip(el, label){
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
  doSearchWith(label);
}

function doSearchWith(q){
  document.getElementById('search-input').value = q;
  doSearch();
}

// ── SEARCH ──
async function doSearch(){
  const q = document.getElementById('search-input').value.trim();
  if(!q) return;

  const grid = document.getElementById('video-grid');
  grid.innerHTML = '<div class="loading">検索中…</div>';
  document.getElementById('watch-page').classList.remove('active');
  document.getElementById('home-page').style.display = '';

  try {
    const r = await fetch('/api/search', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ query: q })
    });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    allVideos = d.videos || [];
    renderGrid();
  } catch(e) {
    grid.innerHTML = '<div class="empty"><span class="e-icon">⚠️</span><p>エラー: ' + esc(e.message) + '</p><p>サーバーログを確認してください</p></div>';
  }
}

// ── GRID ──
function renderGrid(){
  const grid = document.getElementById('video-grid');
  if(!allVideos.length){
    grid.innerHTML = '<div class="empty"><span class="e-icon">📭</span><p>動画がありません</p><p>検索バーからキーワードを入力してください</p></div>';
    return;
  }
  grid.innerHTML = allVideos.map(v => {
    const ch = safe(v.channel, 'C');
    const thumb = safe(v.thumb, '');
    return `<div class="vcard" onclick="openWatch('${v.id}')">
      <div class="thumb">
        <img src="${thumb}" loading="lazy" alt="" onerror="this.style.display='none'">
        <span class="dur">${esc(v.duration||'')}</span>
      </div>
      <div class="v-meta">
        <div class="v-avatar">${esc(firstChar(ch))}</div>
        <div class="v-info">
          <div class="v-title">${esc(v.title)}</div>
          <div class="v-ch">${esc(ch)}</div>
          <div class="v-stats">${esc(v.views||'')}</div>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── WATCH ──
async function openWatch(id){
  const p = document.getElementById('watch-video');
  p.pause(); p.src='';
  document.getElementById('home-page').style.display = 'none';
  document.getElementById('watch-page').classList.add('active');
  document.getElementById('watch-title').textContent = '読み込み中…';
  document.getElementById('up-next-list').innerHTML = '';
  document.getElementById('watch-desc-body').textContent = '';
  window.scrollTo(0,0);
  likeCount = 0;
  document.getElementById('like-count').textContent = '0';
  document.getElementById('watch-sub-btn').classList.remove('subbed');
  document.getElementById('watch-sub-btn').textContent = '登録する';

  try {
    const r = await fetch('/api/video', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ videoId: id })
    });
    const info = await r.json();
    if (info.error) throw new Error(info.error);

    currentVideo = info;
    const author = safe(info.author, 'C');

    document.getElementById('watch-title').textContent = safe(info.title, 'タイトル不明');
    document.getElementById('watch-ch-avatar').textContent = firstChar(author);
    document.getElementById('watch-ch-name').textContent = author;
    document.getElementById('watch-ch-subs').textContent = '';
    document.getElementById('desc-stats').textContent = safe(info.views, '') + ' 回視聴';
    document.getElementById('desc-body').textContent = safe(info.description, '説明なし');

    // Up Next
    const related = info.related || [];
    document.getElementById('up-next-list').innerHTML = related.map(o => {
      const ch2 = safe(o.channel, 'C');
      return `<div class="up-next" onclick="openWatch('${o.id}')">
        <div class="un-thumb"><img src="${safe(o.thumb,'')}" loading="lazy" onerror="this.style.display='none'"><span class="dur">${esc(o.duration||'')}</span></div>
        <div class="un-info"><div class="un-title">${esc(o.title)}</div><div class="un-ch">${esc(ch2)}</div><div class="un-stats">${esc(o.views||'')}</div></div>
      </div>`;
    }).join('');

    // 再生
    if (info.streamUrl) {
      p.src = '/proxy?url=' + encodeURIComponent(info.streamUrl);
      p.play().catch(()=>{});
    } else {
      document.getElementById('watch-title').textContent = safe(info.title,'') + '（ストリームURL未取得）';
    }
  } catch(e) {
    document.getElementById('watch-title').textContent = 'エラー: ' + e.message;
  }
}

// ── ACTIONS ──
function likeVideo(){
  likeCount++;
  document.getElementById('like-count').textContent = likeCount;
}

function toggleSub(){
  const b = document.getElementById('watch-sub-btn');
  b.classList.toggle('subbed');
  b.textContent = b.classList.contains('subbed') ? '登録済み' : '登録する';
}

function shareVideo(){
  if(!currentVideo) return;
  const text = currentVideo.title + ' - MyTube';
  navigator.clipboard.writeText(text).then(()=>alert('コピーしました'));
}

function downloadVideo(){
  if(!currentVideo || !currentVideo.streamUrl) return alert('ダウンロードできません');
  const a = document.createElement('a');
  a.href = '/proxy?url=' + encodeURIComponent(currentVideo.streamUrl);
  a.download = (currentVideo.title || 'video') + '.mp4';
  a.click();
}

// ── EVENTS ──
document.getElementById('search-input').addEventListener('keydown', e => {
  if(e.key === 'Enter') doSearch();
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && document.getElementById('watch-page').classList.contains('active')) goHome();
});

// ── INIT ──
renderGrid();
</script>
</body>
</html>
